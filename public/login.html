<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAIU PROJECTS | Campus Sign In Portal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body.neo-login-page {
      background-color: #ebebeb;
      background-image: radial-gradient(rgba(0, 0, 0, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 2rem;
    }

    body.neo-login-page::before,
    body.neo-login-page::after {
      display: none; /* Disable dark glowing spheres on neo-brutalist page */
    }

    .neo-top-banner {
      border-bottom: 2px solid #000000;
      background: #ffffff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .neo-top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #000000;
    }

    .neo-top-brand .logo-box {
      width: 36px;
      height: 36px;
      border: 2px solid #000000;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .neo-top-brand .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .neo-top-brand-text {
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .neo-top-nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .neo-nav-link {
      background: #ffffff;
      border: 2px solid #000000;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #000000;
      text-decoration: none;
      box-shadow: 2px 2px 0px #000000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .neo-nav-link:hover {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #000000;
      background: #ffd83d;
    }

    .neo-portal-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .neo-brutal-card {
      width: 100%;
      max-width: 580px;
      background: #ffffff;
      border: 3px solid #000000;
      border-radius: 0px;
      box-shadow: 8px 8px 0px #000000;
      overflow: hidden;
      position: relative;
    }

    .neo-tab-strip {
      display: flex;
      border-bottom: 2px solid #000000;
      background: #f1f5f9;
    }

    .neo-tab-item {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      border-right: 2px solid #000000;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #000000;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s;
    }
    .neo-tab-item:last-child {
      border-right: none;
    }

    .neo-tab-item.active {
      background: #ffffff;
      color: #000000;
      border-bottom: 2px solid #ffffff;
      margin-bottom: -2px;
    }

    .neo-tab-item:hover:not(.active) {
      background: #e2e8f0;
    }
  </style>
</head>
<body class="neo-login-page">
  <!-- Minimalist Neo-Brutalist Top Bar -->
  <header class="neo-top-banner">
    <a href="index.html" class="neo-top-brand">
      <div class="logo-box">
        <img src="sai-university-logo.png" alt="Sai University Crest">
      </div>
      <div>
        <div class="neo-top-brand-text">LOST &amp; FOUND</div>
        <div style="font-size:0.65rem; font-weight:800; letter-spacing:0.05em; color:#475569;">CAMPUS PORTAL // EST. 2026</div>
      </div>
    </a>
    <nav class="neo-top-nav-links">
      <a href="index.html" class="neo-nav-link">BOARD</a>
      <a href="index.html" class="neo-nav-link">REPORT</a>
      <a href="dashboard.html" class="neo-nav-link">MY SPACE</a>
    </nav>
  </header>

  <main class="neo-portal-container">
    <div class="neo-brutal-card">
      <!-- Yellow Header Bar (Exact match to screenshot) -->
      <div class="neo-header">
        <h2 class="neo-title" id="portalHeaderTitle">SIGN IN TO CAMPUS</h2>
        <a href="index.html" class="neo-close-btn" title="Back to Board">&times;</a>
      </div>

      <!-- Segmented Sub-Tabs -->
      <div class="neo-tab-strip">
        <button type="button" class="neo-tab-item active" id="tabBtnStudent">STUDENT SIGN IN</button>
        <button type="button" class="neo-tab-item" id="tabBtnAdmin">ADMIN CONSOLE</button>
        <button type="button" class="neo-tab-item" id="tabBtnRegister">NEW REGISTRATION</button>
      </div>

      <!-- Main White Body -->
      <div class="neo-body">
        <!-- Sai University Header Section -->
        <div class="neo-brand-row">
          <div class="neo-logo-box">
            <img src="sai-university-logo.png" alt="Sai University Crest" class="neo-logo-img">
          </div>
          <span class="neo-brand-name">SAI UNIVERSITY</span>
        </div>

        <hr class="neo-divider">

        <!-- Active Session Banner (Shown if already signed in) -->
        <div id="activeSessionBlock" class="neo-alert hidden" style="background:#fffbe6; color:#000; flex-direction:column; align-items:flex-start; margin-bottom:1.25rem;">
          <div style="display:flex; align-items:center; gap:8px; width:100%;">
            <span style="font-size:1.4rem;">👋</span>
            <div>
              <div style="font-weight:900; font-size:0.95rem;" id="activeSessionName">Signed In Student</div>
              <div style="font-size:0.75rem; color:#475569; font-weight:600;" id="activeSessionMeta">student@saiuniversity.edu.in</div>
            </div>
          </div>
          <div style="display:flex; gap:8px; margin-top:12px; width:100%; flex-wrap:wrap;">
            <a href="dashboard.html" class="neo-btn-primary" style="text-decoration:none; padding:8px 16px; font-size:0.75rem;">GO TO DASHBOARD</a>
            <a href="index.html" class="neo-btn-secondary" style="text-decoration:none; padding:8px 14px; font-size:0.75rem;">BROWSE BOARD</a>
            <button id="btnSwitchAccount" class="neo-btn-secondary" style="background:#fee2e2; border-color:#000; padding:8px 14px; font-size:0.75rem;">SIGN OUT &bull; SWITCH</button>
          </div>
        </div>

        <!-- Authentication Container -->
        <div id="authFormsContainer">
          <!-- 1-Click Evaluation Credentials -->
          <div class="neo-quick-chips-wrap">
            <span class="neo-quick-label">⚡ 1-CLICK:</span>
            <button type="button" class="neo-chip-btn" id="chipStudent1">🎓 SAI SRAVAN</button>
            <button type="button" class="neo-chip-btn" id="chipStudent2">🎓 ADITI SHARMA</button>
            <button type="button" class="neo-chip-btn" id="chipAdmin">🛡️ ADMIN (SECURITY)</button>
          </div>

          <!-- Alert Notification -->
          <div id="portalAlert" class="neo-alert hidden">
            <span id="portalAlertIcon">⚠️</span>
            <span id="portalAlertText"></span>
          </div>

          <!-- 1. STUDENT LOGIN FORM -->
          <form id="studentLoginForm">
            <div class="neo-field-group">
              <label for="studentEmail" class="neo-label">UNIVERSITY EMAIL <span class="neo-req">*</span></label>
              <input type="email" id="studentEmail" class="neo-input neo-input-highlight" placeholder="name.initial-YY@department.saiuniversity.edu.in" required autocomplete="email">
            </div>

            <div class="neo-field-group">
              <label for="studentPassword" class="neo-label">PASSWORD <span class="neo-req">*</span></label>
              <div class="neo-password-wrap">
                <input type="password" id="studentPassword" class="neo-input" placeholder="At least 8 characters, letter + number" required minlength="6" autocomplete="current-password">
                <button type="button" class="neo-pwd-toggle" id="toggleStudentPassword" tabindex="-1">👁️</button>
              </div>
            </div>

            <div class="neo-actions-row">
              <button type="submit" class="neo-btn-primary" id="btnStudentSubmit">
                SIGN IN
              </button>
              <button type="button" class="neo-btn-secondary" id="btnToggleToRegister">
                NEW HERE? REGISTER
              </button>
            </div>
          </form>

          <!-- 2. ADMIN LOGIN FORM (Hidden initially) -->
          <form id="adminLoginForm" class="hidden">
            <div class="neo-field-group">
              <label for="adminEmail" class="neo-label">SECURITY ADMIN EMAIL <span class="neo-req">*</span></label>
              <input type="email" id="adminEmail" class="neo-input" placeholder="admin@saiuniversity.edu.in" required autocomplete="email">
            </div>

            <div class="neo-field-group">
              <label for="adminPassword" class="neo-label">MASTER PASSWORD <span class="neo-req">*</span></label>
              <div class="neo-password-wrap">
                <input type="password" id="adminPassword" class="neo-input" placeholder="At least 8 characters" required autocomplete="current-password">
                <button type="button" class="neo-pwd-toggle" id="toggleAdminPassword" tabindex="-1">👁️</button>
              </div>
            </div>

            <div class="neo-actions-row">
              <button type="submit" class="neo-btn-primary" id="btnAdminSubmit" style="background:#ffd83d;">
                ACCESS CONSOLE
              </button>
              <button type="button" class="neo-btn-secondary" id="btnBackToStudent">
                BACK TO STUDENT
              </button>
            </div>
          </form>

          <!-- 3. STUDENT REGISTRATION FORM (Hidden initially) -->
          <form id="studentRegisterForm" class="hidden">
            <div class="neo-field-group">
              <label for="regName" class="neo-label">FULL LEGAL NAME <span class="neo-req">*</span></label>
              <input type="text" id="regName" class="neo-input" placeholder="e.g. Sai Sravan V" required autocomplete="name">
            </div>

            <div class="neo-field-group">
              <label for="regEmail" class="neo-label">UNIVERSITY EMAIL <span class="neo-req">*</span></label>
              <input type="email" id="regEmail" class="neo-input" placeholder="name.initial-YY@department.saiuniversity.edu.in" required autocomplete="email">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
              <div class="neo-field-group">
                <label for="regStudentId" class="neo-label">STUDENT ID / ROLL NO <span class="neo-req">*</span></label>
                <input type="text" id="regStudentId" class="neo-input" placeholder="SAIU2024CS001" required>
              </div>
              <div class="neo-field-group">
                <label for="regPhone" class="neo-label">MOBILE PHONE <span class="neo-req">*</span></label>
                <input type="tel" id="regPhone" class="neo-input" placeholder="+91 98840 55667" required autocomplete="tel">
              </div>
            </div>

            <div class="neo-field-group">
              <label for="regDept" class="neo-label">DEPARTMENT / SCHOOL <span class="neo-req">*</span></label>
              <select id="regDept" class="neo-input neo-select" required>
                <option value="School of Computing & Data Science">School of Computing &amp; Data Science</option>
                <option value="School of Arts & Sciences">School of Arts &amp; Sciences</option>
                <option value="School of Law">School of Law</option>
                <option value="School of Business">School of Business</option>
              </select>
            </div>

            <div class="neo-field-group">
              <label for="regPassword" class="neo-label">PASSWORD <span class="neo-req">*</span></label>
              <div class="neo-password-wrap">
                <input type="password" id="regPassword" class="neo-input" placeholder="At least 8 characters, letter + number" required minlength="6" autocomplete="new-password">
                <button type="button" class="neo-pwd-toggle" id="toggleRegPassword" tabindex="-1">👁️</button>
              </div>
              <div class="neo-strength-meter" style="margin-top:6px;">
                <div class="neo-strength-bar" id="regStrBar1"></div>
                <div class="neo-strength-bar" id="regStrBar2"></div>
                <div class="neo-strength-bar" id="regStrBar3"></div>
              </div>
              <div class="neo-strength-text" id="regStrengthText">At least 8 characters, letter + number</div>
            </div>

            <div class="neo-actions-row">
              <button type="submit" class="neo-btn-primary" id="btnRegisterSubmit">
                CREATE ACCOUNT
              </button>
              <button type="button" class="neo-btn-secondary" id="btnToggleToLogin">
                ALREADY REGISTERED? SIGN IN
              </button>
            </div>
          </form>
        </div>

        <div style="margin-top:20px; padding-top:14px; border-top:2px solid #000; display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; font-weight:800;">
          <a href="index.html" style="color:#000; text-decoration:none;">&larr; BACK TO CAMPUS BOARD</a>
          <span style="color:#64748b; cursor:pointer;" id="btnForgotStudent">FORGOT PASSWORD?</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Self-Service Password Reset Modal -->
  <div id="resetModal" class="modal-overlay hidden">
    <div class="neo-brutal-modal" style="max-width:460px;">
      <div class="neo-header">
        <h3 class="neo-title">PASSWORD RESET</h3>
        <button class="neo-close-btn" id="btnCloseReset">&times;</button>
      </div>
      <div class="neo-body">
        <div id="resetAlert" class="neo-alert hidden">
          <span>⚠️</span><span id="resetAlertText"></span>
        </div>
        <form id="resetPasswordForm">
          <div class="neo-field-group">
            <label for="resetEmail" class="neo-label">REGISTERED EMAIL <span class="neo-req">*</span></label>
            <input type="email" id="resetEmail" class="neo-input" placeholder="student@saiuniversity.edu.in" required>
          </div>
          <div class="neo-field-group">
            <label for="resetNewPassword" class="neo-label">NEW PASSWORD <span class="neo-req">*</span></label>
            <input type="password" id="resetNewPassword" class="neo-input" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <button type="submit" class="neo-btn-primary" id="btnResetSubmit" style="width:100%; justify-content:center; margin-top:8px;">
            UPDATE PASSWORD IN DATABASE
          </button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="login.js"></script>
</body>
</html>
